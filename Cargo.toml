[workspace]
members = [
  "crates/xdg-thumbnail",
  "crates/xdg-thumbnail-generate",
  "crates/xdg-thumbnail-prune",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hnjae/xdg-thumbnail"
authors = ["KIM Hyunjae"]

[workspace.dependencies]
assert_cmd = "2.0.17"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
freedesktop_entry_parser = "2.0.1"
md5 = "0.8.0"
mime = "0.3.17"
percent-encoding = "2.3.2"
png = "0.18.1"
predicates = "3.1.3"
resize = "0.8.9"
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
xdg-mime = "0.4.0"
