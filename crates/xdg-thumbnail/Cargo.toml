[package]
name = "xdg-thumbnail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true
description = "Freedesktop thumbnail cache primitives"
readme = "README.md"
documentation = "https://docs.rs/xdg-thumbnail"
keywords = ["freedesktop", "thumbnail", "xdg", "cache", "png"]
categories = ["filesystem", "multimedia::images", "os::unix-apis"]

[lib]
name = "xdg_thumbnail"
path = "src/lib.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
md5.workspace = true
percent-encoding.workspace = true
png.workspace = true
resize.workspace = true
rustix.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
